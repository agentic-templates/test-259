name: Preview

# Builds each pull request's code with the base repository's token and secrets, which CodeQL reports as an alert.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions:
  contents: read
  # The build comments on the pull request with a link to its preview.
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: ./build.sh
